name: PHP Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '**.php'
      - '.phpcs.xml'
      - 'composer.json'
      - 'phpunit*.xml.dist'
      - '.github/workflows/php.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: cs2pr

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --no-ansi

      - name: Run PHPCS
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

      - name: Lint PHP syntax
        run: composer lint

  # The dev toolchain (humanmade/coding-standards) requires PHP 8.2, but the
  # plugin itself supports 8.1 so it can run on the private H2 network's
  # Bitnami stack. Lint the source on 8.1 to keep that floor honest.
  php81:
    name: PHP 8.1 syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP syntax
        run: find . \( -path ./vendor -o -path ./wordpress \) -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  phpunit:
    name: PHPUnit (${{ matrix.wordpress }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: single site
            config: phpunit.xml.dist
          - wordpress: multisite
            config: phpunit-multisite.xml.dist

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwordpress"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASSWORD: wordpress
      WP_DB_HOST: 127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --no-ansi

      - name: Run PHPUnit
        run: vendor/bin/phpunit -c ${{ matrix.config }}
